server:
  port: 8083
spring:
  # File cấu hình riêng của máy (không commit), xem application-local.yml.example.
  config:
    import: optional:file:./application-local.yml
  application:
    name: business-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/vibecode_business
app:
  # Phải trùng với app.jwt.secret của auth-service để đọc được token. Đặt giá trị trong application-local.yml hoặc biến môi trường JWT_SECRET.
  jwt:
    secret: ${JWT_SECRET:}
  cors:
    allowed-origin: http://localhost:3000,http://localhost:3001
  # Tài khoản dịch vụ để đọc số liệu từ Superset. Đặt giá trị trong application-local.yml hoặc biến môi trường.
  superset:
    url: ${SUPERSET_URL:http://localhost:8088}
    username: ${SUPERSET_USERNAME:}
    password: ${SUPERSET_PASSWORD:}
    dashboard-slug: vibecode-thong-ke
    cache-seconds: 60
